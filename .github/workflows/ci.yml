name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Un job par service : chaque image a son propre contexte de build, son
  # propre scan et sa propre publication.
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.multi
          - service: notifier
            dockerfile: Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      # Actions epinglees par SHA de commit (un tag peut etre deplace).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR exige un nom d'image en minuscules.
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.service }} (local, pour scanner)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}:ci

      - name: Scan Trivy ${{ matrix.service }} (gate sur les tags v*)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          format: table

      - name: Login GHCR (tags seulement)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On pousse exactement l'image qui vient d'etre scannee (pas de rebuild).
      - name: Push ${{ matrix.service }}:${{ github.ref_name }} (tags seulement)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag "$IMAGE:ci" "$IMAGE:${GITHUB_REF_NAME}"
          docker push "$IMAGE:${GITHUB_REF_NAME}"

  # Deploiement continu, SIMULE sur le runner GitHub (pas de VM cible) :
  # meme mecanique qu'un deploiement SSH sur un serveur (repo clone + .env +
  # secret, puis "docker compose pull && docker compose up -d"), suivie d'un
  # test de fumee sur la stack deployee.
  deploy:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout (compose.yml + db/init.sql, comme le repo clone sur le serveur)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparer .env et le secret de la base
        run: |
          cp .env.example .env
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> .env
          echo "TAG=${TAG}" >> .env
          mkdir -p secrets
          openssl rand -hex 16 > secrets/db_password.txt

      - name: Login GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker compose pull && docker compose up -d
        run: |
          docker compose pull
          docker compose up -d --no-build --wait
          docker compose ps

      - name: Test de fumee de la stack deployee
        run: |
          curl -sf localhost:8080/version
          echo
          curl -sf -X POST localhost:8080/products -H "Content-Type: application/json" \
            -d "{\"name\":\"Deploy ${TAG}\",\"price_cents\":100}"
          echo
          sleep 2
          docker compose logs notifier
          docker compose logs notifier | grep -q "nouveau produit .*Deploy ${TAG}"
          docker compose images
